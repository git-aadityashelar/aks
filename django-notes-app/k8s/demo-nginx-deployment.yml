kind: Deployment
apiVersion: apps/v1
metadata:
  name: nginx-deployment
  namespace: notes-app-namespace
  labels:
    app: nginx-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
      - name: nginx-app-container
        image: nginx
        ports:
        - containerPort: 8000
      
